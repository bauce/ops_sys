services:
  ops:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      OPS_DB: /app/backend/data/ops.db
      OPS_PUBLIC_BASE_URL: ${OPS_PUBLIC_BASE_URL:-}
    expose:
      - "8008"
    volumes:
      - ops_data:/app/backend/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8008/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  ops_data:
